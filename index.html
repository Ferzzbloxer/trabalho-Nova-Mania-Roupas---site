<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Roupas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <header class="header">
      <nav class="nav-esquerda">
        <button class="btn-amarelo" data-href="produtos.html">Produtos</button>
        <button class="btn-amarelo" data-href="loja.html">Loja</button>
      </nav>

      <div class="nav-direita">
        <button class="icone-carrinho" id="botao-carrinho" data-href="carrinho.html" aria-label="Carrinho">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 8L4 4H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 8H21L18 16H8L6 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 16L6.5 19H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="21" r="1.3" fill="currentColor"/>
            <circle cx="16" cy="21" r="1.3" fill="currentColor"/>
          </svg>
          <span class="badge-carrinho" id="badge-carrinho">0</span>
        </button>
        <button class="btn-contorno" data-href="entrar.html">Entrar</button>
        <button class="btn-amarelo" data-href="criar-conta.html">Criar conta</button>
      </div>
    </header>

    <div class="corpo">

      <aside class="sidebar">
        <div class="categoria-titulo">Categorias</div>
        <button class="categoria ativa" data-categoria="Camisas">Camisas</button>
        <button class="categoria" data-categoria="Vestidos">Vestidos</button>
        <button class="categoria" data-categoria="Calças">Calças</button>
        <button class="categoria" data-categoria="Jaquetas">Jaquetas</button>
        <button class="categoria" data-categoria="Saias">Saias</button>
        <button class="categoria" data-categoria="Acessórios">Acessórios</button>
      </aside>

      <main class="grade-produtos" id="grade-produtos">
        <div class="slot-produto">
          <span class="slot-mais">+</span>
        </div>
        <div class="slot-produto">
          <span class="slot-mais">+</span>
        </div>
        <div class="slot-produto">
          <span class="slot-mais">+</span>
        </div>
        <div class="slot-produto">
          <span class="slot-mais">+</span>
        </div>
      </main>

    </div>
  </div>

  <script src="script.js"></script>

</html>
